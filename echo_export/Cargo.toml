[package]
name = "echo_export"
version = "0.1.0"
edition = "2024"
description = "Exports what echo's #[tree] macro parses in a project, as JSON; and Rust types for it"

[features]
# the command-line exporter; without it, only the types in `schema` (and serde)
default = ["cli"]
cli = ["dep:syn", "dep:quote", "dep:proc-macro2", "dep:either"]

[[bin]]
name = "echo_export"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the same parser as the macro (`echo_macro/src/tree.rs`, included as a module)
syn = { workspace = true, features = ["full", "visit", "visit-mut"], optional = true }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, features = ["span-locations"], optional = true }
either = { workspace = true, optional = true }
